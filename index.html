<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オタクのいちごさん🍓 Official Site</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0d0d12;
            --neon-pink: #ff0055;
            --neon-cyan: #00f0ff;
            --accent-yellow: #ffd500;
            --text-main: #ffffff;
            --card-bg: #14141c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            padding-bottom: 80px;
        }

        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }

        .pop-card {
            background-color: var(--card-bg);
            border: 4px solid var(--neon-cyan);
            border-radius: 16px;
            box-shadow: 8px 8px 0px var(--neon-pink);
            padding: 40px;
            margin-bottom: 60px;
        }

        h2 {
            font-size: 2rem;
            color: var(--neon-cyan);
            margin-bottom: 30px;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        /* フォームのスタイルをここに集約 */
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--neon-cyan);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }
        .contact-form textarea { height: 180px; }
        .submit-btn {
            background-color: var(--neon-pink);
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px;
            border: 3px solid #fff;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 5px 5px 0px var(--neon-cyan);
            transition: 0.2s;
        }
        .submit-btn:hover { transform: scale(1.02); box-shadow: 0 0 15px var(--neon-pink); }
    </style>
</head>
<body>

    <div class="container">
        <!-- ⑥ CONTACT（Formspree版に完全変更） -->
        <div class="pop-card">
            <h2>Contact</h2>
            <p style="text-align: center; margin-bottom: 30px; color: #b0c4de;">
                出演のご依頼やお問い合わせはこちらから！🍓
            </p>
            
            <form action="https://formspree.io/f/mbgrklzg" method="POST" class="contact-form">
                <input type="text" name="name" required placeholder="お名前 / 貴社名">
                <input type="email" name="email" required placeholder="メールアドレス">
                <input type="text" name="subject" placeholder="お問い合わせ件名">
                <textarea name="message" required placeholder="お問い合わせ内容"></textarea>
                <button type="submit" class="submit-btn">送信する</button>
            </form>
        </div>
    </div>

</body>
</html>
