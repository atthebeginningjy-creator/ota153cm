<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>オタクのいちごさん 公式サイト｜身長153cmの女優コンビ</title>
    <meta name="description" content="身長153cmの通山栞と米沢のぞみによるこだわり全開の女優コンビ「オタクのいちごさん」の公式サイト。80年代アイドルプロジェクト「恋するオルゴール」やTikTok・SNS、イベント情報をお届け！">
    <meta name="keywords" content="オタクのいちごさん,通山栞,米沢のぞみ,恋するオルゴール,80年代アイドル,女優">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* 背景はB案のダークサイバー仕様 */
            --bg-dark: #0d0d12;
            --neon-pink: #ff0055;
            --neon-cyan: #00f0ff;
            --accent-yellow: #ffd500;
            --text-main: #ffffff;
            --card-bg: #14141c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            /* B案のサイバー空間風グリッド背景 */
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            line-height: 1.8;
            letter-spacing: 0.05em;
            padding-bottom: 80px;
        }

        /* 画面を広く使うワイドコンテナ（最大1200px） */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* ----- メインロゴ：確実に大きく表示（最大900px） ----- */
        .hero {
            text-align: center;
            padding: 40px 20px 60px 20px;
            margin-bottom: 40px;
        }
        .main-logo {
            width: 100% !important;
            max-width: 900px !important; /* 強制的に大きく拡大 */
            height: auto !important;
            display: inline-block !important;
            filter: drop-shadow(0 0 20px rgba(255, 0, 85, 0.6));
        }
        .hero-catch {
            font-size: 1.4rem;
            font-weight: bold;
            background-color: var(--accent-yellow);
            color: #000;
            padding: 12px 35px;
            border: 3px solid #fff;
            border-radius: 50px;
            display: inline-block;
            margin-top: 25px;
            box-shadow: 0 0 15px rgba(255, 213, 0, 0.5);
            transform: rotate(-1deg);
        }

        /* ----- A案のポップで可愛いカード型 ＋ B案のダークサイバー感の融合 ----- */
        .pop-card {
            background-color: var(--card-bg);
            border: 4px solid var(--neon-cyan);
            border-radius: 16px;
            box-shadow: 8px 8px 0px var(--neon-pink);
            padding: 40px;
            margin-bottom: 60px;
        }

        h2 {
            font-size: 2rem;
            color: var(--neon-cyan);
            margin-bottom: 30px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            border-bottom: 4px dashed var(--neon-pink);
            display: inline-block;
            padding-bottom: 5px;
        }

        /* 横並びレイアウト用クラス */
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            align-items: center;
        }
        
        .flex-half {
            flex: 1 1 350px;
            text-align: left;
        }

        /* ② ABOUT（日本語解説） */
        .about-text {
            font-size: 1.1rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.03);
            padding: 25px;
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-radius: 12px;
            line-height: 2;
        }

        /* ③ MEMBER（ワイド配置） */
        .member-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }
        .member-card {
            text-align: center;
            background: rgba(0,0,0,0.3);
            border: 3px solid #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 6px 6px 0px var(--neon-cyan);
        }
        .member-img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border: 3px solid var(--neon-pink);
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .member-name {
            font-size: 1.5rem;
            font-weight: 900;
            background-color: var(--neon-pink);
            color: #fff;
            padding: 5px 15px;
            border-radius: 30px;
            display: inline-block;
            box-shadow: 0 0 10px var(--neon-pink);
        }

        /* ⑤ PROJECT（ワイド配置） */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }
        .project-item {
            background: rgba(0,0,0,0.4);
            border: 3px solid #fff;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 6px 6px 0px var(--accent-yellow);
        }
        .project-item img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border: 2px solid var(--neon-cyan);
            border-radius: 8px;
            margin-bottom: 15px;
            display: block;
        }
        .project-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }
